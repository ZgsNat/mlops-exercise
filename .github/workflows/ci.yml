name: MLOps Pipeline CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Flake8 Linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          uv run flake8 src app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce line length and complexity
          uv run flake8 src app tests --count --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          uv run pytest -v tests/ --cov=src --cov-report=term-missing

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mlops-exercise:ci
